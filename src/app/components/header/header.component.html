<header class="app-header">
  <div class="header-title">
    <img [src]="fordLogo" alt="Ford Logo" class="ford-logo">
    <span>ET L&D</span>
  </div>
  <div *ngIf="currentUser" class="header-actions">
    <span class="user-info">Welcome, {{ getUserDisplayName() }} ({{ currentUser.role }})</span>
    <button (click)="logout()" class="logout-button">Log Out</button>
  </div>
</header>
