<div class="request-form-container">
  <div class="form-header">
    <button type="button" class="btn-back" (click)="onBack()" title="Back to Dashboard">
      <span class="back-icon">←</span> Back
    </button>
    <h2>Submit Training Request</h2>
  </div>
  
  <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="request-form">
    
    <!-- Requestor ID (Read-only) -->
    <div class="form-group">
      <label for="requestorId">Requestor CDS ID</label>
      <input 
        type="text" 
        id="requestorId" 
        [value]="currentUser?.cdsId || ''" 
        readonly
        class="form-control readonly-field"
      />
      <small class="form-text">This field is auto-filled from your login</small>
    </div>

    <!-- Justification -->
    <div class="form-group">
      <label for="justification">Justification <span class="required">*</span></label>
      <textarea 
        id="justification"
        formControlName="justification"
        rows="4"
        placeholder="Enter the justification for this training request"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('justification')"
      ></textarea>
      <small class="error-message" *ngIf="isFieldInvalid('justification')">
        {{ getErrorMessage('justification') }}
      </small>
    </div>

    <!-- TAN Number -->
    <div class="form-group">
      <label for="tanNo">TAN Number <span class="required">*</span></label>
      <input 
        type="text"
        id="tanNo"
        formControlName="tanNo"
        placeholder="e.g., TAN-12345"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('tanNo')"
      />
      <small class="error-message" *ngIf="isFieldInvalid('tanNo')">
        {{ getErrorMessage('tanNo') }}
      </small>
    </div>

    <!-- Number of Participants -->
    <div class="form-group">
      <label for="noOfParticipants">Number of Participants <span class="required">*</span></label>
      <input 
        type="number"
        id="noOfParticipants"
        formControlName="noOfParticipants"
        placeholder="Enter number of participants"
        min="1"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('noOfParticipants')"
      />
      <small class="error-message" *ngIf="isFieldInvalid('noOfParticipants')">
        {{ getErrorMessage('noOfParticipants') }}
      </small>
    </div>

    <!-- Department -->
    <div class="form-group">
      <label for="department">Department <span class="required">*</span></label>
      <select 
        id="department"
        formControlName="department"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('department')"
      >
        <option value="" disabled selected>Select Department</option>
        <option value="Engineering">Engineering</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
        <option value="Operations">Operations</option>
        <option value="Sales">Sales</option>
        <option value="Marketing">Marketing</option>
        <option value="Quality">Quality</option>
        <option value="Manufacturing">Manufacturing</option>
        <option value="R&D">R&D</option>
        <option value="Other">Other</option>
      </select>
      <small class="error-message" *ngIf="isFieldInvalid('department')">
        {{ getErrorMessage('department') }}
      </small>
    </div>

    <!-- Curriculum File Upload -->
    <div class="form-group">
      <label for="curriculum">Curriculum Document (PDF/Excel)</label>
      <div class="file-input-wrapper">
        <input 
          type="file"
          id="curriculum"
          (change)="onFileSelected($event)"
          accept=".pdf,.xls,.xlsx"
          class="file-input"
        />
        <label for="curriculum" class="file-label">
          <span class="file-button">Choose File</span>
          <span class="file-name">{{ selectedFileName }}</span>
        </label>
      </div>
      <small class="form-text">Optional: Upload PDF or Excel file</small>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Submitting...' : 'Submit Request' }}
      </button>
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="onReset()"
        [disabled]="isSubmitting"
      >
        Reset
      </button>
    </div>
  </form>
</div>
